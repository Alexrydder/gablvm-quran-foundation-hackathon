gablvm_core.settings:
  type: config_object
  label: 'GABLVM Core settings'
  mapping:
    quran_api:
      type: mapping
      label: 'Quran API Settings'
      mapping:
        api_mode:
          type: string
          label: 'API Mode'
        client_id:
          type: string
          label: 'Client ID'
        client_secret:
          type: string
          label: 'Client Secret'
        default_reciter:
          type: integer
          label: 'Default Reciter ID'
        default_translation:
          type: integer
          label: 'Default Translation ID'
    prayer_times:
      type: mapping
      label: 'Prayer Times Settings'
      mapping:
        calculation_method:
          type: integer
          label: 'Calculation Method'
        school:
          type: integer
          label: 'School (Hanafi/Shafi)'
    features:
      type: mapping
      label: 'Feature Toggles'
      mapping:
        quran_player_enabled:
          type: boolean
          label: 'Quran Player Enabled'
        prayer_times_enabled:
          type: boolean
          label: 'Prayer Times Enabled'
        hijri_calendar_enabled:
          type: boolean
          label: 'Islamic Calendar Enabled'
        show_translation_text:
          type: boolean
          label: 'Show Translation Text'
    cloudflare:
      type: mapping
      label: 'Cloudflare Settings'
      mapping:
        zone_id:
          type: string
          label: 'Zone ID'
        api_key:
          type: string
          label: 'API Key'
        email:
          type: string
          label: 'Account Email'
    hijri_calendar:
      type: mapping
      label: 'Hijri Calendar Settings'
      mapping:
        date_overrides:
          type: string
          label: 'Date Overrides'
    quran_player:
      type: mapping
      label: 'Quran Player Bismillah Settings'
      mapping:
        embedded_bismillah_reciters:
          type: string
          label: 'Reciter IDs with embedded Bismillah (comma-separated)'
        verse_reciter_map:
          type: string
          label: 'Chapter-to-verse reciter ID mapping (id:id pairs, comma-separated)'
    cyberpanel_email:
      type: mapping
      label: 'CyberPanel Cloud Email Settings'
      mapping:
        api_key:
          type: string
          label: 'API Key'
        from_address:
          type: string
          label: 'From Email Address'
        from_name:
          type: string
          label: 'From Name'
    display:
      type: mapping
      label: 'Display Settings'
      mapping:
        greeting_message:
          type: string
          label: 'Quran Player Greeting Message'
        prayer_times_message:
          type: string
          label: 'Prayer Times Greeting Message'

    youtube:
      type: mapping
      label: 'YouTube API Settings'
      mapping:
        api_key:
          type: string
          label: 'YouTube API Key'
